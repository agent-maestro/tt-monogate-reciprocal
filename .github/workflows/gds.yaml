name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

      # VERSION ECHO -- run 003's UNAVAILABLE, closed properly on the second attempt.
      #
      # ATTEMPT 1 (run 007) RAN BEFORE THE ACTION AND PRINTED BLANKS. The toolchain is installed BY
      # the gl_test action, so echoing first reported `iverilog: command not found` and empty cocotb
      # and pytest fields. AN EMPTY PROVENANCE FIELD IS WORSE THAN A MISSING STEP -- it looks like a
      # measurement. Run 003's honest `UNAVAILABLE` was strictly better than run 007's blank.
      #
      # Now: AFTER the action, `if: always()` so a failed test still yields provenance, and each
      # field REFUSES rather than printing empty.
      - name: Echo tool versions (provenance)
        if: always()
        run: |
          fail=0
          emit () {   # emit <label> <value>
            if [ -z "$2" ]; then
              echo "$1: UNAVAILABLE — not readable in this job"
              fail=1
            else
              echo "$1: $2"
            fi
          }
          emit "iverilog" "$(iverilog -V 2>/dev/null | head -1)"
          emit "python  " "$(python3 --version 2>&1)"
          emit "cocotb  " "$(python3 -m pip show cocotb 2>/dev/null | awk '/^Version:/{print $2}')"
          emit "pytest  " "$(python3 -m pip show pytest 2>/dev/null | awk '/^Version:/{print $2}')"
          emit "runner  " "$(. /etc/os-release; echo "$PRETTY_NAME") $(uname -m)"
          if [ "$fail" -ne 0 ]; then
            echo "::warning::one or more provenance fields are UNAVAILABLE — recorded as instrument failure, not as a value"
          fi

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
